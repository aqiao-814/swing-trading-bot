name: v2-trade
# The autonomous 30-minute paper-trading run for **v2**: the cross-sectional
# long/short book on the NautilusTrader engine. Each firing restores the
# persisted book, replays every bar completed since the last run, and publishes
# state + dashboard data to the public site.
#
# v1 (the long-only RRL day-trader) is RETIRED. Its final record is frozen in
# docs/v1-final.json and published, unchanging, at /v1/ on the site.
# Fires every 30 minutes from the market open. 09:30 ET open is 13:30 UTC in
# EDT / 14:30 UTC in EST, so the :00/:30 cadence over 13:00-21:30 UTC covers
# the full session in both, and each half-hour bar completes on the following
# :00/:30 -- the next firing picks it up. Off-hours firings are idempotent
# no-ops. A firing at the open itself is a no-op until 10:00 ET, when the day's
# first 30m bar completes.
#
# Budget: the ~670-name universe refreshes in ~2 min of bulk requests and the
# whole run lands well inside the half-hour gap between firings. The concurrency
# group serialises runs rather than cancelling them, so a slow run delays the
# next bar's decision instead of corrupting portfolio state.

on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: portfolio-state
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tradingbot
        # gymnasium: EpisodeResult lives in env/trading_env.py, which imports it
        # at module top; the trading loop never uses it and torch stays out.
        # nautilus_trader is pinned: the macOS wheels for 1.231+ are built for
        # macOS 26, so pinning keeps CI and local development on one version.
        run: pip install -e . gymnasium

      - name: Restore bar cache
        uses: actions/cache@v4
        with:
          path: data30
          key: bars30-v1-${{ github.run_id }}
          restore-keys: bars30-v1-

      - name: Pull portfolio state from site repo
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$DEPLOY_KEY" | ssh-add -
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:aqiao-814/swingbot-live.git /tmp/site
          mkdir -p artifacts
          # v2 keeps its book under state/v2. There is deliberately no migration
          # from v1's state/paper: v2 incepts fresh at $100k so the two records
          # are comparable rather than one continuing the other's drawdown.
          if [ -d /tmp/site/state/v2 ]; then
            cp -r /tmp/site/state/v2 artifacts/v2
            echo "restored v2 book through $(python -c "import json;print(json.load(open('artifacts/v2/portfolio/state.json'))['last_processed'])")"
          else
            echo "no v2 book yet -- this run incepts at \$100,000, all cash"
          fi

      - name: Run the trading bars
        run: |
          python -m tradingbot.cli trade --config configs/cloud.yaml --capital 100000 \
            || (echo "retrying after 90s (data source hiccup?)" && sleep 90 && \
                python -m tradingbot.cli trade --config configs/cloud.yaml --capital 100000)

      - name: Export dashboard data
        run: python scripts/export_site_data.py

      - name: Refresh intraday layer
        run: pip install yfinance && python scripts/live_quotes.py || true

      - name: Publish state + site
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$DEPLOY_KEY" | ssh-add -
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
          mkdir -p /tmp/site/state /tmp/site/v1
          rm -rf /tmp/site/state/v2
          cp -r artifacts/v2 /tmp/site/state/v2
          cp site/index.html site/data.json /tmp/site/
          cp site/live.json /tmp/site/ 2>/dev/null || true
          # The v1 archive is frozen: copied so the page exists, never regenerated.
          cp site/v1/index.html site/v1/data.json /tmp/site/v1/
          cd /tmp/site
          git config user.name "tradingbot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -m "bar $(date -u +%FT%H:%M)"
          for i in 1 2 3; do
            git push && break
            git pull --rebase && sleep 5
          done

      - name: Keepalive
        # GitHub disables cron workflows after 60 days without repo activity,
        # and this repo's daily commits all land in the site repo. A monthly
        # heartbeat commit here keeps the schedules alive.
        run: |
          cd "$GITHUB_WORKSPACE"
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "tradingbot"
            git config user.email "actions@users.noreply.github.com"
            date -u > .github/heartbeat
            git add .github/heartbeat
            git commit -m "keepalive heartbeat"
            git push
          else
            echo "recent activity; no heartbeat needed"
          fi

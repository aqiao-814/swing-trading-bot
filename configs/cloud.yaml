# Config for the hosted live paper bot (GitHub Actions) -- **v2**.
# 30-MINUTE cadence: decide on every completed 30-minute bar (13 per session,
# 09:30..15:30 ET), fill at the next bar's open. The workflow fires every 30
# minutes from the market open.
#
# Yahoo only serves ~60 days of 30-minute bars, far too little to pretrain a
# policy on -- so the live model is SEEDED from a model trained offline on five
# years of daily bars: scripts/backtest_5y.py writes
# artifacts/backtest5y/models/rrl_latest.bin, which is published to the site repo
# as state/models/rrl_latest.bin before inception. At inception the engine
# loads that seed, clears its daily-bar recurrence, then refines it on the ~60
# days of 30m history available before trading forward. `pretrain_years` here is
# just that light refinement window, not a from-scratch warm-up.
seed: 7
run_name: cloud
data:
  root: data30
features:
  # 60 days of 30m bars is only ~520 rows, so the default long-memory windows
  # (252-bar z-score, 1e-4 fracdiff ≈ 280-bar width, 300-bar warmup) would drop
  # every row. These shorter windows leave ~320 usable bars. Crucially they keep
  # return_horizons and vol_windows at their defaults, so the feature COLUMN set
  # is byte-for-byte identical to the seed model's -- only the trailing-window
  # lengths change, which does not rename any column.
  zscore_window: 100
  fracdiff_threshold: 0.01
  warmup: 60
paper:
  interval: 30m
  # v2 HOLDS OVERNIGHT. `day_trading` is v1's flag and the v2 runner ignores it;
  # it is set false so a stray read cannot resurrect flat-by-close, which is one
  # of the two properties that made v1 unable to trade the edge FINDINGS 10a
  # actually found (the other being long-only).
  day_trading: false
  # ~670 liquid US names (S&P 500 + Nasdaq 100 + screened high-volume movers).
  # The bulk 30m refresh for the whole list measured ~130s in 17 chunked
  # requests, so the widened universe costs a couple of minutes of the
  # half-hour budget, not the whole of it.
  universe: extended
  # No cap on how many names the book holds. Targets are conviction-
  # proportional and then scaled to land gross on max_gross_exposure, so a
  # wider book means thinner positions rather than more leverage; entries too
  # small to buy a whole share are dropped instead of queued.
  max_positions: null
  # v2's inception, and the FLOOR on the first tradable bar. Bars before it
  # are fetched and used to warm the alpha's ~20-session lookbacks; none of
  # them can be traded. Moving this date forward is the reset switch: the next
  # run retires the book that incepted earlier (under artifacts/v2/retired/)
  # and incepts a fresh $100,000, all cash.
  #
  # 2026-08-18 is v2's real forward record. The first live book incepted itself
  # at data_start because nothing gated the tradable grid, and back-filled
  # 2026-05-26 -> 08-17 -- 13,571 fills, ending at $78,680 -- in a single
  # firing. That is a backtest, not a forward record, and it is kept as one
  # (FINDINGS 14). The first tradable bar here is the 09:30 bar, which
  # completes at 10:00 ET.
  start: '2026-08-18T09:30'
  # Kept well before `start`: the alpha needs momentum_days=20 sessions (~262
  # 30m bars) of warmup before the first tradable bar, and Yahoo only serves
  # ~60 days of 30m history anyway.
  data_start: '2026-05-24'
  pretrain_years: 0.2
  # The seed is trained on daily bars where the recurrence drifted to u>1 (an
  # explosive recurrence -> saturated, degenerate convictions). Cap it below 1
  # so the seed is tempered on load and stays a contraction through pretraining
  # and live trading -- keeping the conviction spread the ranking depends on.
  learn_max_recurrence: 0.7
  # Stop discipline on the day-trader's clock: a stopped-out name is locked out
  # for 6 bars (3 hours), not 10 calendar days, and the stop de-gross window
  # rolls over the same span -- so one stop never freezes a name (or pins the
  # gross cap down) for weeks of 30-minute decisions. The bot decides on every
  # completed bar and may re-enter the same session once the lockout lapses.
  stop_cooldown_bars: 6
  # News-sentiment tilt. The weekend workflow collects free economy + company
  # news into news/signal.json and merges it to main; every weekday trading run
  # then reads that file out of its own checkout.
  #
  # v2 applies it ADDITIVELY on the standardised cross-sectional score, so news
  # can originate a short -- see tradingbot/nautilus/signals.py:NewsConfig2 for
  # the weights, which live in code rather than here because they are in units
  # of cross-sectional sigma. The macro tone tilts net exposure instead of any
  # single name. `tilt_weight` below is v1's multiplicative weight and is unused
  # by v2; `enabled` and `signal_path` still apply. A missing or corrupt file
  # means "no news"; it can never stop the bot trading.
  news:
    enabled: true
    signal_path: news/signal.json
    tilt_weight: 0.30
    macro_weight: 0.5
    half_life_days: 2.0
    max_age_days: 10.0
